[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otis"
version = "0.0.0"
description = "OTIS instrument capture, supervision, analysis and evidence tools"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.18,<5",
  "pyserial>=3.5",
]

[project.scripts]
otis = "host.otis_tools.__main__:main"

[project.optional-dependencies]
dev = ["pytest", "ruff==0.16.7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["host", "host.*", "tools"]
