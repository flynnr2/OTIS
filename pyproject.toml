[project]
name = "otis"
version = "0.0.0"
description = "Open Timing Instrumentation System host tooling scaffold"
requires-python = ">=3.9"
dependencies = [
  "jsonschema>=4.18,<5",
  "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
